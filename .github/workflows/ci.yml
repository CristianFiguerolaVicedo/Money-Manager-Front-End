name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Opens the built site in a real browser: catches a blank page before it reaches production
      - name: Smoke test of the build
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/smoke-test.mjs
